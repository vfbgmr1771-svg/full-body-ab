name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a GitHub release

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APK not built: add the ANDROID_* signing secrets (see android-signing/README.txt on the dev machine)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: steps.key.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app and copy it into the Android project
        if: steps.key.outputs.ready == 'true'
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Restore signing key
        if: steps.key.outputs.ready == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed APK
        if: steps.key.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/full-body-ab.apk"

      - name: Publish release
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${{ github.run_number }}" full-body-ab.apk \
            --title "Full Body A/B for Android 1.0.${{ github.run_number }}" \
            --notes "Install: open this page on the phone, download full-body-ab.apk and open it. Updates install over the previous version and keep your data." \
            --latest
